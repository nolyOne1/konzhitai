openapi: 3.1.0
info:
  title: 云令控制 API
  version: 0.1.0
  description: 多服务器脚本调度平台的中央控制接口。
paths:
  /api/health:
    get:
      operationId: getHealth
      summary: 检查 API 健康状态
      responses:
        "200":
          description: API 正常
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
  /api/auth/login:
    post:
      operationId: login
      summary: 登录管理控制台
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: 登录成功，并通过安全 Cookie 返回会话令牌
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [message, expires_at]
                properties:
                  message:
                    type: string
                    const: 登录成功
                  expires_at:
                    type: string
                    format: date-time
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/auth/logout:
    post:
      operationId: logout
      summary: 退出当前会话
      security:
        - sessionCookie: []
      responses:
        "204":
          description: 已退出登录
  /api/auth/session:
    get:
      operationId: getSession
      summary: 获取当前登录用户
      security:
        - sessionCookie: []
      responses:
        "200":
          description: 当前会话有效
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: "#/components/schemas/SessionUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/servers/enrollment-tokens:
    post:
      operationId: createServerEnrollmentToken
      summary: 创建一次性服务器注册令牌
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollmentTokenRequest"
      responses:
        "201":
          description: 注册令牌创建成功，明文令牌仅在本次响应显示
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollmentTokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: 当前用户不是管理员
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/dashboard:
    get:
      operationId: getDashboard
      summary: 获取运行总览
      security:
        - sessionCookie: []
      responses:
        "200":
          description: 服务器、任务、成功率和最近动态统计
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/servers:
    get:
      operationId: listServers
      summary: 获取服务器和最新资源快照
      security:
        - sessionCookie: []
      responses:
        "200":
          description: 服务器列表
          content:
            application/json:
              schema:
                type: object
                required: [servers]
                properties:
                  servers:
                    type: array
                    items:
                      $ref: "#/components/schemas/Server"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/servers/{id}:
    patch:
      operationId: updateServer
      summary: 更新服务器调度设置
      description: 排空只阻止新任务分配；停用会断开当前代理连接并阻止重连。
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServerUpdate"
      responses:
        "200":
          description: 服务器已更新
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Server"
        "400":
          description: 更新内容无效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: 当前用户无服务器管理权限
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: 服务器不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/agent/enroll:
    post:
      operationId: enrollAgent
      summary: 使用一次性令牌注册执行代理
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token:
                  type: string
                  writeOnly: true
      responses:
        "201":
          description: 注册成功，独立代理凭据仅在本次响应显示
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentCredentials"
        "401":
          description: 注册令牌无效、已使用或已过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/agent/connect:
    get:
      operationId: connectAgent
      summary: 建立代理 WebSocket 长连接
      description: 代理通过此连接上报心跳；中央服务以凭据绑定的服务器身份为准。
      security:
        - agentBearer: []
      responses:
        "101":
          description: WebSocket 协议升级成功
        "401":
          description: 代理凭据无效或已撤销
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: yunling_session
    agentBearer:
      type: http
      scheme: bearer
      bearerFormat: 云令代理凭据
  schemas:
    Role:
      type: string
      enum: [admin, operator, developer, viewer]
    SessionUser:
      type: object
      required: [user_id, email, display_name, roles]
      properties:
        user_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
    EnrollmentTokenRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
        cloud_provider:
          type: string
        region:
          type: string
        labels:
          type: object
          additionalProperties:
            type: string
    EnrollmentTokenResponse:
      type: object
      required: [id, token, expires_at]
      properties:
        id:
          type: string
          format: uuid
        token:
          type: string
          writeOnly: true
        expires_at:
          type: string
          format: date-time
    AgentCredentials:
      type: object
      required: [server_id, credential]
      properties:
        server_id:
          type: string
          format: uuid
        credential:
          type: string
          writeOnly: true
    AgentHeartbeat:
      type: object
      required:
        - server_id
        - sequence
        - sent_at
        - cpu_total_milli
        - cpu_used_milli
        - memory_total_bytes
        - memory_used_bytes
        - disk_total_bytes
        - disk_free_bytes
        - running_tasks
        - runtimes
        - agent_version
      properties:
        server_id:
          type: string
          format: uuid
        sequence:
          type: integer
          minimum: 1
        sent_at:
          type: string
          format: date-time
        cpu_total_milli:
          type: integer
          minimum: 0
        cpu_used_milli:
          type: integer
          minimum: 0
        memory_total_bytes:
          type: integer
          minimum: 0
        memory_used_bytes:
          type: integer
          minimum: 0
        disk_total_bytes:
          type: integer
          minimum: 0
        disk_free_bytes:
          type: integer
          minimum: 0
        running_tasks:
          type: integer
          minimum: 0
        runtimes:
          type: array
          items:
            type: string
        agent_version:
          type: string
    Dashboard:
      type: object
      required: [onlineServers, totalServers, runningRuns, queuedRuns, todaySuccessRate, servers, recentEvents]
      properties:
        onlineServers:
          type: integer
          minimum: 0
        totalServers:
          type: integer
          minimum: 0
        runningRuns:
          type: integer
          minimum: 0
        queuedRuns:
          type: integer
          minimum: 0
        todaySuccessRate:
          type: number
          minimum: 0
          maximum: 100
        servers:
          type: array
          items:
            $ref: "#/components/schemas/Server"
        recentEvents:
          type: array
          items:
            $ref: "#/components/schemas/RecentEvent"
    RecentEvent:
      type: object
      required: [id, type, message, occurredAt]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
        message:
          type: string
        occurredAt:
          type: string
          format: date-time
    Server:
      type: object
      required:
        - id
        - name
        - cloudProvider
        - region
        - status
        - enabled
        - draining
        - labels
        - runtimes
        - agentVersion
        - schedulingWeight
        - cpuUsagePercent
        - memoryTotalBytes
        - memoryAvailableBytes
        - diskTotalBytes
        - diskAvailableBytes
        - runningTasks
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        cloudProvider:
          type: string
        region:
          type: string
        status:
          type: string
          enum: [pending, online, offline, draining, quarantined]
        enabled:
          type: boolean
        draining:
          type: boolean
        labels:
          type: object
          additionalProperties:
            type: string
        runtimes:
          type: array
          items:
            type: string
        agentVersion:
          type: string
        schedulingWeight:
          type: integer
          minimum: 1
          maximum: 1000
        cpuUsagePercent:
          type: number
          minimum: 0
          maximum: 100
        memoryTotalBytes:
          type: integer
          minimum: 0
        memoryAvailableBytes:
          type: integer
          minimum: 0
        diskTotalBytes:
          type: integer
          minimum: 0
        diskAvailableBytes:
          type: integer
          minimum: 0
        runningTasks:
          type: integer
          minimum: 0
        lastSeenAt:
          type: [string, "null"]
          format: date-time
    ServerUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
        labels:
          type: object
          additionalProperties:
            type: string
        schedulingWeight:
          type: integer
          minimum: 1
          maximum: 1000
        enabled:
          type: boolean
        draining:
          type: boolean
  responses:
    Unauthorized:
      description: 未登录、会话已失效或登录凭据错误
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
