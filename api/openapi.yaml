openapi: 3.1.0
info:
  title: 云令控制 API
  version: 0.1.0
  description: 多服务器脚本调度平台的中央控制接口。
paths:
  /api/releases/agent/latest:
    get:
      operationId: getRecommendedAgentManifest
      summary: 获取推荐代理版本的公开安装清单
      description: 能力来自经过摘要绑定的发布清单；调度仍以节点心跳实际报告的能力为准，版本号不代表功能支持。
      security: []
      responses:
        "200":
          description: 当前推荐版本与双架构安装包
          content:
            application/json:
              schema:
                type: object
                required: [version, artifacts]
                properties:
                  version: {type: string}
                  capabilities:
                    type: array
                    uniqueItems: true
                    items: {type: string, enum: [self_upgrade_v1, run_artifacts_v1]}
                    description: 可选；兼容未声明能力的旧清单。
                  artifacts:
                    type: array
                    items:
                      type: object
                      required: [os, arch, file_name, byte_size, sha256, download_url]
                      properties:
                        id: {type: string}
                        os: {type: string, enum: [linux]}
                        arch: {type: string, enum: [amd64, arm64]}
                        file_name: {type: string}
                        byte_size: {type: integer, format: int64, minimum: 1}
                        sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
                        download_url: {type: string}
        "429": {description: 请求过于频繁}
        "503": {description: 暂无可用的推荐版本}
  /api/agent/runs/{id}/artifacts/{name}:
    post:
      operationId: uploadRunArtifact
      summary: 代理上传本次运行策略允许的文件产物
      description: 校验代理所属节点、执行令牌、固定脚本版本的产物策略及总配额。同名同内容重放幂等，不覆盖不同内容。
      security:
        - agentBearer: []
      parameters:
        - $ref: "#/components/parameters/RunID"
        - {name: name, in: path, required: true, schema: {type: string}}
        - {name: X-Execution-Token, in: header, required: true, schema: {type: string}}
        - {name: X-Content-SHA256, in: header, required: true, schema: {type: string, pattern: '^[0-9a-f]{64}$'}}
        - {name: Content-Length, in: header, required: true, schema: {type: integer, minimum: 0, maximum: 104857600}}
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary}
      responses:
        "201":
          description: 新产物已保存
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RunArtifact"}
        "200":
          description: 相同产物已经保存
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RunArtifact"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {description: 同名文件内容冲突}
        "413": {description: 超出文件大小、数量或运行总配额}
  /api/operations/notifications/feishu/test:
    post:
      operationId: enqueueFeishuTest
      summary: 管理员提交幂等测试通知请求
      security:
        - sessionCookie: []
      parameters:
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, format: uuid}, description: 同一操作者重放同一 UUID 返回原通知，不重复发送。}
        - {name: Origin, in: header, required: true, schema: {type: string, format: uri}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false}
      responses:
        "202":
          description: 已入队或返回原通知记录
          content:
            application/json:
              schema: {type: object, properties: {id: {type: string}, status: {type: string}, attempts: {type: integer}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /api/health:
    get:
      operationId: getHealth
      summary: 检查 API 健康状态
      responses:
        "200":
          description: API 正常
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
  /api/auth/login:
    post:
      operationId: login
      summary: 登录管理控制台
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: 登录成功，并通过安全 Cookie 返回会话令牌
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [message, expires_at]
                properties:
                  message:
                    type: string
                    const: 登录成功
                  expires_at:
                    type: string
                    format: date-time
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/auth/logout:
    post:
      operationId: logout
      summary: 退出当前会话
      security:
        - sessionCookie: []
      responses:
        "204":
          description: 已退出登录
  /api/auth/session:
    get:
      operationId: getSession
      summary: 获取当前登录用户
      security:
        - sessionCookie: []
      responses:
        "200":
          description: 当前会话有效
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: "#/components/schemas/SessionUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/servers/enrollment-tokens:
    post:
      operationId: createServerEnrollmentToken
      summary: 创建一次性服务器注册令牌
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollmentTokenRequest"
      responses:
        "201":
          description: 注册令牌创建成功，明文令牌仅在本次响应显示
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollmentTokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: 当前用户不是管理员
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/dashboard:
    get:
      operationId: getDashboard
      summary: 获取运行总览
      security:
        - sessionCookie: []
      responses:
        "200":
          description: 服务器、任务、成功率和最近动态统计
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/server-groups:
    get:
      operationId: listServerGroups
      summary: 获取服务器组及成员数量
      security:
        - sessionCookie: []
      responses:
        "200":
          description: 服务器组列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  groups:
                    type: array
                    items: {$ref: "#/components/schemas/ServerGroup"}
    post:
      operationId: createServerGroup
      summary: 创建服务器组
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ServerGroupRequest"}
      responses:
        "201":
          description: 服务器组已创建
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ServerGroup"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "409": {description: 服务器组名称重复}
  /api/server-groups/{id}:
    patch:
      operationId: renameServerGroup
      summary: 修改服务器组名称
      security:
        - sessionCookie: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ServerGroupRequest"}
      responses:
        "200":
          description: 服务器组名称已修改
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ServerGroup"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {description: 服务器组名称重复}
  /api/servers:
    get:
      operationId: listServers
      summary: 获取服务器和最新资源快照
      security:
        - sessionCookie: []
      responses:
        "200":
          description: 服务器列表
          content:
            application/json:
              schema:
                type: object
                required: [servers]
                properties:
                  servers:
                    type: array
                    items:
                      $ref: "#/components/schemas/Server"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/servers/{id}:
    patch:
      operationId: updateServer
      summary: 更新服务器调度设置
      description: 排空只阻止新任务分配；停用会断开当前代理连接并阻止重连。
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServerUpdate"
      responses:
        "200":
          description: 服务器已更新
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Server"
        "400":
          description: 更新内容无效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: 当前用户无服务器管理权限
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: 服务器不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/scripts:
    get:
      operationId: listScripts
      summary: 获取中央脚本列表
      security:
        - sessionCookie: []
      responses:
        "200":
          description: 脚本、分类、标签、运行环境与当前版本
          content:
            application/json:
              schema:
                type: object
                required: [scripts]
                properties:
                  scripts:
                    type: array
                    items:
                      $ref: "#/components/schemas/Script"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createScript
      summary: 创建脚本和初始草稿
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScriptCreateRequest"
      responses:
        "201":
          description: 脚本已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Script"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/scripts/import:
    post:
      operationId: importScript
      summary: 导入文本脚本为中央草稿
      description: 仅接受不超过 1 MB 的 .sh、.py、.js 和 .ps1 UTF-8 文本文件。
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                name:
                  type: string
                description:
                  type: string
      responses:
        "201":
          description: 脚本已导入为草稿
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Script"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/scripts/{id}:
    get:
      operationId: getScript
      summary: 获取脚本草稿和版本历史
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ScriptID"
      responses:
        "200":
          description: 脚本编辑详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScriptDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/scripts/{id}/draft:
    put:
      operationId: saveScriptDraft
      summary: 保存脚本草稿
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ScriptID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScriptEditorRequest"
      responses:
        "200":
          description: 草稿已保存
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScriptDraft"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/scripts/{id}/publish:
    post:
      operationId: publishScript
      summary: 发布不可变脚本版本
      description: 脚本包按 SHA-256 内容寻址保存；发布说明必须包含中文，并明确分发目标。
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ScriptID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScriptPublishRequest"
      responses:
        "201":
          description: 不可变版本已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScriptVersion"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/scripts/{id}/versions:
    get:
      operationId: listScriptVersions
      summary: 获取脚本不可变版本历史
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ScriptID"
      responses:
        "200":
          description: 按版本号倒序返回版本
          content:
            application/json:
              schema:
                type: object
                required: [versions]
                properties:
                  versions:
                    type: array
                    items:
                      $ref: "#/components/schemas/ScriptVersion"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/scripts/{id}/versions/{versionID}/content:
    get:
      operationId: getScriptVersionContent
      summary: 获取已校验的历史版本文本内容
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ScriptID"
        - name: versionID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 历史脚本内容
          content:
            application/json:
              schema:
                type: object
                required: [content]
                properties:
                  content:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/scripts/{id}/rollback:
    post:
      operationId: rollbackScript
      summary: 将历史内容重新发布为新版本
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ScriptID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScriptRollbackRequest"
      responses:
        "201":
          description: 回滚内容已追加为新版本
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScriptVersion"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/scripts/{id}/syncs:
    get:
      operationId: listScriptSyncs
      summary: 获取脚本版本在各服务器的同步状态
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ScriptID"
      responses:
        "200":
          description: 同步状态列表
          content:
            application/json:
              schema:
                type: object
                required: [syncs]
                properties:
                  syncs:
                    type: array
                    items:
                      $ref: "#/components/schemas/ScriptSync"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/scripts/{id}/syncs/{syncID}/retry:
    post:
      operationId: retryScriptSync
      summary: 重新同步失败或漂移的服务器脚本
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ScriptID"
        - name: syncID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: 已重新进入等待下载状态
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/tasks:
    get:
      operationId: listTasks
      summary: 获取任务定义列表
      security:
        - sessionCookie: []
      responses:
        "200":
          description: 任务定义、资源约束与排队规则
          content:
            application/json:
              schema:
                type: object
                required: [tasks]
                properties:
                  tasks:
                    type: array
                    items:
                      $ref: "#/components/schemas/TaskDefinition"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createTask
      summary: 创建任务定义
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskDefinitionRequest"
      responses:
        "201":
          description: 任务定义已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDefinition"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/tasks/cron/validate:
    post:
      operationId: validateTaskCron
      summary: 校验五段 Cron 表达式和 IANA 时区
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CronValidationRequest"
      responses:
        "200":
          description: Cron 规则有效
          content:
            application/json:
              schema:
                type: object
                required: [valid]
                properties:
                  valid:
                    type: boolean
                    const: true
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/tasks/{id}:
    get:
      operationId: getTask
      summary: 获取任务定义
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/TaskID"
      responses:
        "200":
          description: 任务定义详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDefinition"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateTask
      summary: 更新任务定义
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/TaskID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskDefinitionRequest"
      responses:
        "200":
          description: 任务定义已更新
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDefinition"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteTask
      summary: 删除没有运行记录的任务定义
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/TaskID"
      responses:
        "204":
          description: 任务定义已删除
        "404":
          $ref: "#/components/responses/NotFound"
  /api/tasks/{id}/enabled:
    patch:
      operationId: setTaskEnabled
      summary: 启用或停用任务
      description: 停用时默认保留已经排队的运行实例；只有明确传入 cancelQueued=true 才取消它们。
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/TaskID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled]
              properties:
                enabled:
                  type: boolean
                cancelQueued:
                  type: boolean
                  default: false
      responses:
        "204":
          description: 任务状态已更新
        "404":
          $ref: "#/components/responses/NotFound"
  /api/tasks/{id}/run:
    post:
      operationId: runTask
      summary: 手动创建排队运行实例
      description: 创建时锁定具体脚本版本并复制资源、重试和参数快照；没有可用服务器时继续排队。
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/TaskID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                parameters:
                  type: object
                  additionalProperties: true
      responses:
        "400":
          description: 合并默认参数与本次覆盖值后，不满足所选脚本版本的必填项或类型要求。
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "201":
          description: 运行实例已进入排队队列
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskRun"
        "409":
          description: 任务已停用或没有可执行版本
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/tasks/{id}/schedules:
    get:
      operationId: listTaskSchedules
      summary: 获取任务的定时计划
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/TaskID"
      responses:
        "200":
          description: 定时计划列表
          content:
            application/json:
              schema:
                type: object
                required: [schedules]
                properties:
                  schedules:
                    type: array
                    items:
                      $ref: "#/components/schemas/TaskSchedule"
    post:
      operationId: createTaskSchedule
      summary: 创建任务定时计划
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/TaskID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskScheduleRequest"
      responses:
        "201":
          description: 定时计划已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskSchedule"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/tasks/{id}/schedules/{scheduleID}:
    put:
      operationId: updateTaskSchedule
      summary: 修改定时计划并重新计算下一次执行时间
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/TaskID"
        - name: scheduleID
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskScheduleRequest"
      responses:
        "200":
          description: 定时计划已修改
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskSchedule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteTaskSchedule
      summary: 删除任务定时计划
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/TaskID"
        - name: scheduleID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: 定时计划已删除
        "404":
          $ref: "#/components/responses/NotFound"
  /api/runs:
    get:
      operationId: listRuns
      summary: 获取执行记录
      description: 按创建时间倒序查询持久化执行记录，可筛选并分页访问历史数据。排队是运行状态之一。
      security:
        - sessionCookie: []
      parameters:
        - {name: query, in: query, schema: {type: string}, description: 任务名、脚本名或运行标识的字面子串}
        - {name: state, in: query, schema: {$ref: "#/components/schemas/RunState"}}
        - {name: taskId, in: query, schema: {type: string, format: uuid}}
        - {name: scriptId, in: query, schema: {type: string, format: uuid}}
        - {name: serverId, in: query, schema: {type: string, format: uuid}}
        - {name: from, in: query, schema: {type: string, format: date-time}}
        - {name: until, in: query, schema: {type: string, format: date-time}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, default: 0}}
      responses:
        "200":
          description: 执行记录列表
          content:
            application/json:
              schema:
                type: object
                required: [runs, hasMore, limit, offset]
                properties:
                  hasMore: {type: boolean}
                  limit: {type: integer}
                  offset: {type: integer}
                  runs:
                    type: array
                    items:
                      $ref: "#/components/schemas/RunView"
  /api/runs/{id}:
    get:
      operationId: getRun
      summary: 获取执行详情
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RunID"
      responses:
        "200":
          description: 执行上下文、资源、服务器、版本和结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunView"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/runs/{id}/logs:
    get:
      operationId: downloadRunLogs
      summary: 下载当前已持久化的全部运行日志
      description: 下载内容不受浏览器接收的实时事件数量限制；正在运行的任务下载到请求时刻已保存的日志。
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RunID"
      responses:
        "200":
          description: UTF-8 日志附件
          content:
            text/plain:
              schema: {type: string}
        "404":
          $ref: "#/components/responses/NotFound"
  /api/runs/{id}/logs/archive/info:
    get:
      operationId: getRunLogArchive
      summary: 查询压缩日志归档状态
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RunID"
      responses:
        "200":
          description: available 表示存在归档，current 表示包含当前所有持久化日志块。
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RunLogArchive"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/runs/{id}/logs/archive:
    get:
      operationId: downloadRunLogArchive
      summary: 下载包含全部已保存日志的压缩归档
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RunID"
      responses:
        "200":
          description: Gzip 压缩的 NDJSON 日志附件
          content:
            application/gzip:
              schema: {type: string, format: binary}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {description: 归档正在补齐迟到日志，可使用完整日志下载接口。}
        "503": {description: 归档对象暂时不可用}
  /api/runs/{id}/artifacts:
    get:
      operationId: listRunArtifacts
      summary: 列出本次运行已上传的文件产物
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RunID"
      responses:
        "200":
          description: 产物可能在脚本结束后继续上传，列表不暴露对象存储位置。
          content:
            application/json:
              schema:
                type: object
                properties:
                  artifacts:
                    type: array
                    items: {$ref: "#/components/schemas/RunArtifact"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/runs/{id}/artifacts/{artifactID}:
    get:
      operationId: downloadRunArtifact
      summary: 下载属于指定运行的文件产物
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RunID"
        - {name: artifactID, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: 文件附件
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/runs/{id}/events:
    get:
      operationId: streamRunEvents
      summary: 订阅运行状态与实时日志
      description: 通过 SSE 发送 state 和 log 事件；断线重连后服务端会重新发送历史事件，客户端按事件 ID 去重。
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RunID"
        - name: follow
          in: query
          required: false
          description: 设置为 false 时只返回当前事件，供诊断和测试使用。
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: Server-Sent Events 流
          content:
            text/event-stream:
              schema:
                type: string
  /api/runs/{id}/cancel:
    post:
      operationId: cancelRun
      summary: 取消排队或运行中的任务
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RunID"
      responses:
        "204":
          description: 排队任务已取消，或取消命令已发送到执行服务器
        "409":
          description: 当前状态不能取消或执行服务器未连接
  /api/runs/{id}/retry:
    post:
      operationId: retryRun
      summary: 按安全策略重试任务
      description: 仅当任务允许幂等执行、重试次数未耗尽且原进程已确认不存在时创建新运行实例。
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RunID"
      responses:
        "201":
          description: 新运行实例已进入排队队列
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id:
                    type: string
                    format: uuid
        "409":
          description: 不满足安全重试条件
  /api/secrets:
    get:
      operationId: listSecrets
      summary: 获取敏感参数元数据
      description: 永远不返回明文、密文、nonce 或数据密钥。
      security:
        - sessionCookie: []
      responses:
        "200":
          description: 当前用户可引用的敏感参数元数据
          content:
            application/json:
              schema:
                type: object
                required: [secrets]
                properties:
                  secrets:
                    type: array
                    items:
                      $ref: "#/components/schemas/SecretMetadata"
    post:
      operationId: createSecret
      summary: 创建加密敏感参数
      description: 仅管理员可用；响应只返回元数据，实际值不会再次显示。
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, value]
              properties:
                name:
                  type: string
                  minLength: 1
                value:
                  type: string
                  minLength: 1
                  writeOnly: true
      responses:
        "201":
          description: 已使用信封加密保存
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretMetadata"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/members:
    get:
      operationId: listMembers
      summary: 获取团队成员与角色
      security:
        - sessionCookie: []
      responses:
        "200":
          description: 团队成员列表
          content:
            application/json:
              schema:
                type: object
                required: [members]
                properties:
                  members:
                    type: array
                    items:
                      $ref: "#/components/schemas/Member"
  /api/members/{id}/roles:
    put:
      operationId: updateMemberRoles
      summary: 替换成员角色
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [roles]
              properties:
                roles:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items:
                    $ref: "#/components/schemas/Role"
      responses:
        "200":
          description: 成员角色已更新并写入审计日志
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/audit:
    get:
      operationId: listAuditEvents
      summary: 获取只追加审计日志
      security:
        - sessionCookie: []
      parameters:
        - {name: actorId, in: query, schema: {type: string}}
        - {name: action, in: query, schema: {type: string}}
        - {name: targetType, in: query, schema: {type: string}}
        - {name: targetId, in: query, schema: {type: string}, description: 按任务或运行等资源标识筛选审计}
        - {name: limit, in: query, schema: {type: integer}}
      responses:
        "200":
          description: 最近的关键操作审计记录
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditEvent"
  /api/alerts:
    get:
      operationId: listAlerts
      summary: 获取系统告警
      description: 同一资源与错误码在五分钟窗口内合并计数。
      security:
        - sessionCookie: []
      responses:
        "200":
          description: 系统告警列表
          content:
            application/json:
              schema:
                type: object
                required: [alerts]
                properties:
                  alerts:
                    type: array
                    items:
                      $ref: "#/components/schemas/Alert"
  /api/alerts/{id}/acknowledge:
    post:
      operationId: acknowledgeAlert
      summary: 确认系统告警
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: 告警已确认
  /api/servers/{id}/credentials/rotate:
    post:
      operationId: rotateServerCredential
      summary: 轮换代理凭据
      description: 新凭据首次成功连接前旧凭据保持有效，确认新连接后旧凭据自动吊销。
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "201":
          description: 新凭据已签发，明文仅在本次响应显示
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentCredentials"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/servers/{id}/credentials/revoke:
    post:
      operationId: revokeServerCredentials
      summary: 紧急吊销代理凭据
      description: 立即吊销该服务器全部代理身份、断开连接并标记离线。
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: 全部代理凭据已吊销
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/agent/enroll:
    post:
      operationId: enrollAgent
      summary: 使用一次性令牌注册执行代理
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token:
                  type: string
                  writeOnly: true
      responses:
        "201":
          description: 注册成功，独立代理凭据仅在本次响应显示
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentCredentials"
        "401":
          description: 注册令牌无效、已使用或已过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/agent/connect:
    get:
      operationId: connectAgent
      summary: 建立代理 WebSocket 长连接
      description: 代理通过此连接上报心跳、运行状态、日志块和重连对账信息；中央服务以凭据绑定的服务器身份为准。
      security:
        - agentBearer: []
      responses:
        "101":
          description: WebSocket 协议升级成功
        "401":
          description: 代理凭据无效或已撤销
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/agent/scripts/{versionID}/artifact:
    get:
      operationId: downloadAgentScriptArtifact
      summary: 下载待同步的不可变脚本包
      security:
        - agentBearer: []
      parameters:
        - name: versionID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: gzip 压缩的 tar 脚本包，代理会在原子切换前校验 SHA-256
          headers:
            X-Content-SHA256:
              schema:
                type: string
                pattern: ^[0-9a-f]{64}$
          content:
            application/gzip:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: yunling_session
    agentBearer:
      type: http
      scheme: bearer
      bearerFormat: 云令代理凭据
  parameters:
    RunID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ScriptID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TaskID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    Role:
      type: string
      enum: [admin, operator, developer, viewer]
    SessionUser:
      type: object
      required: [user_id, email, display_name, roles]
      properties:
        user_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
    EnrollmentTokenRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
        cloud_provider:
          type: string
        region:
          type: string
        labels:
          type: object
          additionalProperties:
            type: string
    EnrollmentTokenResponse:
      type: object
      required: [id, token, expires_at]
      properties:
        id:
          type: string
          format: uuid
        token:
          type: string
          writeOnly: true
        expires_at:
          type: string
          format: date-time
    AgentCredentials:
      type: object
      required: [server_id, credential]
      properties:
        server_id:
          type: string
          format: uuid
        credential:
          type: string
          writeOnly: true
    AgentHeartbeat:
      type: object
      required:
        - server_id
        - sequence
        - sent_at
        - cpu_total_milli
        - cpu_used_milli
        - memory_total_bytes
        - memory_used_bytes
        - disk_total_bytes
        - disk_free_bytes
        - running_tasks
        - runtimes
        - agent_version
      properties:
        server_id:
          type: string
          format: uuid
        sequence:
          type: integer
          minimum: 1
        sent_at:
          type: string
          format: date-time
        cpu_total_milli:
          type: integer
          minimum: 0
        cpu_used_milli:
          type: integer
          minimum: 0
        memory_total_bytes:
          type: integer
          minimum: 0
        memory_used_bytes:
          type: integer
          minimum: 0
        disk_total_bytes:
          type: integer
          minimum: 0
        disk_free_bytes:
          type: integer
          minimum: 0
        running_tasks:
          type: integer
          minimum: 0
        log_spool_used_bytes:
          type: integer
          minimum: 0
          description: 代理本地待上传日志缓冲已用字节数。
        log_spool_limit_bytes:
          type: integer
          minimum: 0
          description: 代理本地日志缓冲容量上限；旧版代理可省略。
        runtimes:
          type: array
          items:
            type: string
        agent_version:
          type: string
    Dashboard:
      type: object
      required: [onlineServers, totalServers, runningRuns, queuedRuns, todaySuccessRate, servers, recentEvents, activeRuns, scriptSync]
      properties:
        activeRuns:
          type: array
          maxItems: 6
          items:
            $ref: "#/components/schemas/DashboardRun"
        scriptSync:
          $ref: "#/components/schemas/DashboardScriptSync"
        onlineServers:
          type: integer
          minimum: 0
        totalServers:
          type: integer
          minimum: 0
        runningRuns:
          type: integer
          minimum: 0
        queuedRuns:
          type: integer
          minimum: 0
        todaySuccessRate:
          type: number
          minimum: 0
          maximum: 100
        servers:
          type: array
          items:
            $ref: "#/components/schemas/Server"
        recentEvents:
          type: array
          items:
            $ref: "#/components/schemas/RecentEvent"
    DashboardRun:
      type: object
      properties:
        id: {type: string, format: uuid}
        taskName: {type: string}
        scriptName: {type: string}
        serverName: {type: string}
        state: {$ref: "#/components/schemas/RunState"}
        resultSummary: {type: string}
        queuedAt: {type: string, format: date-time}
    DashboardScriptSync:
      type: object
      description: 仅聚合各脚本当前已发布版本的节点副本，不包含历史版本。
      properties:
        publishedScripts: {type: integer, minimum: 0}
        total: {type: integer, minimum: 0}
        ready: {type: integer, minimum: 0}
        pending: {type: integer, minimum: 0}
        downloading: {type: integer, minimum: 0}
        failed: {type: integer, minimum: 0}
        drifted: {type: integer, minimum: 0}
    RecentEvent:
      type: object
      required: [id, type, message, occurredAt]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
        message:
          type: string
        occurredAt:
          type: string
          format: date-time
    Server:
      type: object
      required:
        - id
        - name
        - cloudProvider
        - region
        - status
        - enabled
        - draining
        - labels
        - runtimes
        - agentVersion
        - schedulingWeight
        - cpuUsagePercent
        - memoryTotalBytes
        - memoryAvailableBytes
        - diskTotalBytes
        - diskAvailableBytes
        - runningTasks
      properties:
        serverGroupId:
          type: string
          description: 服务器组标识，未分组时为空字符串。
        id:
          type: string
          format: uuid
        name:
          type: string
        cloudProvider:
          type: string
        region:
          type: string
        status:
          type: string
          enum: [pending, online, offline, draining, quarantined]
        enabled:
          type: boolean
        draining:
          type: boolean
        labels:
          type: object
          additionalProperties:
            type: string
        runtimes:
          type: array
          items:
            type: string
        agentVersion:
          type: string
        schedulingWeight:
          type: integer
          minimum: 1
          maximum: 1000
        cpuUsagePercent:
          type: number
          minimum: 0
          maximum: 100
        memoryTotalBytes:
          type: integer
          minimum: 0
        memoryAvailableBytes:
          type: integer
          minimum: 0
        diskTotalBytes:
          type: integer
          minimum: 0
        diskAvailableBytes:
          type: integer
          minimum: 0
        runningTasks:
          type: integer
          minimum: 0
        lastSeenAt:
          type: [string, "null"]
          format: date-time
    Script:
      type: object
      required: [id, name, description, runtime, category, tags, currentVersionId, currentVersion, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        runtime:
          $ref: "#/components/schemas/ScriptRuntime"
        category:
          type: string
        tags:
          type: array
          items:
            type: string
        currentVersionId:
          type: string
          description: 尚未发布时为空字符串。
        currentVersion:
          type: integer
          minimum: 0
        draftUpdatedAt:
          type: [string, "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ScriptRuntime:
      type: string
      enum: [bash, python3, node, powershell]
    DistributionRule:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode:
          type: string
          enum: [all_compatible, server_group, labels, on_demand]
        serverGroupId:
          type: string
        labels:
          type: object
          additionalProperties:
            type: string
    ParameterDefinition:
      type: object
      additionalProperties: false
      required: [name, type, required]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [string, number, boolean]
        required:
          type: boolean
        description:
          type: string
    ResourceRequirements:
      type: object
      additionalProperties: false
      required: [cpuMillicores, memoryBytes, diskBytes]
      properties:
        cpuMillicores:
          type: integer
          minimum: 1
        memoryBytes:
          type: integer
          minimum: 1
        diskBytes:
          type: integer
          minimum: 1
    ScriptManifest:
      type: object
      required: [runtime, entrypoint, category, tags, distribution, parameterDefinitions, resources]
      properties:
        artifacts:
          $ref: "#/components/schemas/ArtifactPolicy"
        runtime:
          $ref: "#/components/schemas/ScriptRuntime"
        entrypoint:
          type: string
        category:
          type: string
        tags:
          type: array
          items:
            type: string
        distribution:
          $ref: "#/components/schemas/DistributionRule"
        parameterDefinitions:
          type: array
          items:
            $ref: "#/components/schemas/ParameterDefinition"
        resources:
          $ref: "#/components/schemas/ResourceRequirements"
    ScriptDraft:
      type: object
      required: [scriptId, baseVersionId, content, manifest, updatedAt]
      properties:
        scriptId:
          type: string
          format: uuid
        baseVersionId:
          type: string
          description: 尚未发布时为空字符串。
        content:
          type: string
          maxLength: 1048576
        manifest:
          $ref: "#/components/schemas/ScriptManifest"
        updatedAt:
          type: string
          format: date-time
    ScriptVersion:
      type: object
      required: [id, scriptId, number, artifactUri, artifactSha256, entrypoint, manifest, releaseNotes, createdBy, createdAt]
      properties:
        id:
          type: string
          format: uuid
        scriptId:
          type: string
          format: uuid
        number:
          type: integer
          minimum: 1
        artifactUri:
          type: string
          pattern: ^scripts/.+/[0-9a-f]{64}\.tar\.gz$
        artifactSha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        entrypoint:
          type: string
        manifest:
          $ref: "#/components/schemas/ScriptManifest"
        releaseNotes:
          type: string
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
    ScriptSync:
      type: object
      required: [id, serverId, serverName, scriptId, versionId, versionNumber, state, artifactSha256, errorCode, errorMessage, blocked, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        serverId:
          type: string
          format: uuid
        serverName:
          type: string
        scriptId:
          type: string
          format: uuid
        versionId:
          type: string
          format: uuid
        versionNumber:
          type: integer
          minimum: 1
        state:
          type: string
          enum: [pending, downloading, ready, failed, drifted]
        artifactSha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        errorCode:
          type: string
        errorMessage:
          type: string
        blocked:
          type: boolean
        failureCount:
          type: integer
          minimum: 0
        nextRetryAt:
          type: [string, "null"]
          format: date-time
        retryLimit:
          type: integer
          description: 连续失败达到 3 次后需人工重试；人工重试重置计数。
        syncedAt:
          type: [string, "null"]
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ScriptDetail:
      type: object
      required: [script, draft, versions]
      properties:
        script:
          $ref: "#/components/schemas/Script"
        draft:
          $ref: "#/components/schemas/ScriptDraft"
        versions:
          type: array
          items:
            $ref: "#/components/schemas/ScriptVersion"
    ScriptCreateRequest:
      type: object
      additionalProperties: false
      required: [name, runtime]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        runtime:
          $ref: "#/components/schemas/ScriptRuntime"
        entrypoint:
          type: string
        category:
          type: string
        tags:
          type: array
          items:
            type: string
        content:
          type: string
          maxLength: 1048576
    ScriptEditorRequest:
      type: object
      additionalProperties: false
      required: [content, runtime, entrypoint, category, tags, distribution, parameterDefinitions, resources]
      properties:
        artifacts:
          $ref: "#/components/schemas/ArtifactPolicy"
        content:
          type: string
          minLength: 1
          maxLength: 1048576
        runtime:
          $ref: "#/components/schemas/ScriptRuntime"
        entrypoint:
          type: string
        category:
          type: string
        tags:
          type: array
          items:
            type: string
        distribution:
          $ref: "#/components/schemas/DistributionRule"
        parameterDefinitions:
          type: array
          items:
            $ref: "#/components/schemas/ParameterDefinition"
        resources:
          $ref: "#/components/schemas/ResourceRequirements"
    ScriptPublishRequest:
      type: object
      additionalProperties: false
      required: [content, runtime, entrypoint, category, tags, distribution, parameterDefinitions, resources, releaseNotes]
      properties:
        artifacts:
          $ref: "#/components/schemas/ArtifactPolicy"
        content:
          type: string
          minLength: 1
          maxLength: 1048576
        runtime:
          $ref: "#/components/schemas/ScriptRuntime"
        entrypoint:
          type: string
        category:
          type: string
        tags:
          type: array
          items:
            type: string
        distribution:
          $ref: "#/components/schemas/DistributionRule"
        parameterDefinitions:
          type: array
          items:
            $ref: "#/components/schemas/ParameterDefinition"
        resources:
          $ref: "#/components/schemas/ResourceRequirements"
        releaseNotes:
          type: string
          description: 必须包含中文发布说明。
    ScriptRollbackRequest:
      type: object
      additionalProperties: false
      required: [versionId, releaseNotes]
      properties:
        versionId:
          type: string
          format: uuid
        releaseNotes:
          type: string
          description: 必须包含中文回滚说明。
    TaskResources:
      type: object
      additionalProperties: false
      required: [cpuMillicores, memoryBytes, diskBytes]
      properties:
        cpuMillicores:
          type: integer
          minimum: 1
        memoryBytes:
          type: integer
          minimum: 1
        diskBytes:
          type: integer
          minimum: 1
    TaskRetryPolicy:
      type: object
      additionalProperties: false
      required: [maxRetries, backoffSeconds]
      properties:
        maxRetries:
          type: integer
          minimum: 0
        backoffSeconds:
          type: integer
          minimum: 0
    TaskDefinitionRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - scriptId
        - versionPolicy
        - parameters
        - secretRefs
        - priority
        - requiredLabels
        - requiredRuntime
        - resources
        - maxConcurrency
        - timeoutSeconds
        - maxWaitSeconds
        - retryPolicy
        - idempotent
        - enabled
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        scriptId:
          type: string
          format: uuid
        versionPolicy:
          type: string
          enum: [latest, pinned]
        pinnedVersionId:
          type: string
          format: uuid
        parameters:
          type: object
          additionalProperties: true
        secretRefs:
          type: object
          additionalProperties:
            type: string
        priority:
          type: integer
          minimum: 0
          maximum: 100
        requiredLabels:
          type: object
          additionalProperties:
            type: string
        requiredRuntime:
          $ref: "#/components/schemas/ScriptRuntime"
        resources:
          $ref: "#/components/schemas/TaskResources"
        maxConcurrency:
          type: integer
          minimum: 1
        timeoutSeconds:
          type: integer
          minimum: 1
        maxWaitSeconds:
          type: integer
          minimum: 0
          description: 0 表示无限等待；大于 0 表示最大排队秒数。
        retryPolicy:
          $ref: "#/components/schemas/TaskRetryPolicy"
        idempotent:
          type: boolean
        enabled:
          type: boolean
    TaskDefinition:
      allOf:
        - $ref: "#/components/schemas/TaskDefinitionRequest"
        - type: object
          required: [id, scriptName, createdAt, updatedAt]
          properties:
            id:
              type: string
              format: uuid
            scriptName:
              type: string
            createdBy:
              type: string
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
    TaskRun:
      type: object
      required:
        - id
        - definitionId
        - scriptVersionId
        - triggerType
        - state
        - parameters
        - requiredLabels
        - requiredRuntime
        - priority
        - resources
        - maxConcurrency
        - timeoutSeconds
        - maxWaitSeconds
        - retryPolicy
        - idempotent
        - queuedAt
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        definitionId:
          type: string
          format: uuid
        scriptVersionId:
          type: string
          format: uuid
        triggerType:
          type: string
          enum: [manual, schedule, retry]
        state:
          type: string
          enum: [queued, scheduling, assigned, syncing, running, succeeded, failed, timed_out, cancelled, expired, unknown]
        parameters:
          type: object
          additionalProperties: true
        requiredLabels:
          type: object
          additionalProperties:
            type: string
        requiredRuntime:
          type: string
        priority:
          type: integer
          minimum: 0
          maximum: 100
        resources:
          $ref: "#/components/schemas/TaskResources"
        maxConcurrency:
          type: integer
          minimum: 1
        timeoutSeconds:
          type: integer
          minimum: 1
        maxWaitSeconds:
          type: integer
          minimum: 0
          description: 0 表示无限等待；大于 0 表示最大排队秒数。
        retryPolicy:
          $ref: "#/components/schemas/TaskRetryPolicy"
        idempotent:
          type: boolean
        scheduledFor:
          type: [string, "null"]
          format: date-time
        queuedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    ArtifactPolicy:
      type: object
      description: 可选产物采集策略。仅采集当前运行工作目录顶层的普通文件，排除隐藏文件、符号链接与代理保留文件；不配置时不采集。
      required: [allowedGlobs, maxFileBytes, maxTotalBytes]
      properties:
        allowedGlobs:
          type: array
          minItems: 1
          maxItems: 20
          items: {type: string, maxLength: 128}
        maxFileBytes: {type: integer, minimum: 1, maximum: 104857600}
        maxTotalBytes: {type: integer, minimum: 1, maximum: 524288000, description: 必须不小于单文件上限；每次运行最多 100 个文件。}
    RunArtifact:
      type: object
      required: [id, runId, name, byteSize, sha256, createdAt]
      properties:
        id: {type: string, format: uuid}
        runId: {type: string, format: uuid}
        name: {type: string}
        byteSize: {type: integer, minimum: 0}
        sha256: {type: string}
        createdAt: {type: string, format: date-time}
    RunState:
      type: string
      enum: [queued, scheduling, assigned, syncing, running, succeeded, failed, timed_out, cancelled, expired, unknown]
    ResourceUsage:
      type: object
      required: [sampledAt]
      description: 代理实测资源用量；不支持的计量省略，内存峰值为系统或采样观测峰值。
      properties:
        cpuTimeMillis: {type: integer, minimum: 0, description: 累计 CPU 时间毫秒}
        memoryBytes: {type: integer, minimum: 0}
        peakMemoryBytes: {type: integer, minimum: 0}
        processes: {type: integer, minimum: 0}
        sampledAt: {type: string, format: date-time}
    ServerGroup:
      type: object
      required: [id, name, serverCount, createdAt]
      properties:
        id: {type: string}
        name: {type: string}
        serverCount: {type: integer, minimum: 0}
        createdAt: {type: string, format: date-time}
    ServerGroupRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 80}
    RunLogArchive:
      type: object
      required: [available, current]
      properties:
        available: {type: boolean}
        current: {type: boolean}
        byteSize: {type: integer, minimum: 0}
        sha256: {type: string}
        chunkCount: {type: integer, minimum: 0}
        archivedAt: {type: string, format: date-time}
    RunView:
      type: object
      required: [id, definitionId, taskName, scriptId, scriptName, scriptVersionId, versionNumber, triggerType, state, parameters, resources, requiredRuntime, priority, attempt, maxRetries, idempotent, processConfirmedGone, queuedAt, resultSummary, createdAt]
      properties:
        usage:
          $ref: "#/components/schemas/ResourceUsage"
        id:
          type: string
          format: uuid
        definitionId:
          type: string
          format: uuid
        taskName:
          type: string
        scriptId:
          type: string
          format: uuid
        scriptName:
          type: string
        scriptVersionId:
          type: string
          format: uuid
        versionNumber:
          type: integer
          minimum: 1
        serverId:
          type: string
          format: uuid
        serverName:
          type: string
        triggerType:
          type: string
          enum: [manual, schedule, retry]
        state:
          type: string
          enum: [queued, scheduling, assigned, syncing, running, succeeded, failed, timed_out, cancelled, expired, unknown]
        parameters:
          type: object
          additionalProperties: true
        resources:
          $ref: "#/components/schemas/TaskResources"
        requiredRuntime:
          type: string
        priority:
          type: integer
          minimum: 0
          maximum: 100
        attempt:
          type: integer
          minimum: 1
        maxRetries:
          type: integer
          minimum: 0
        idempotent:
          type: boolean
        processConfirmedGone:
          type: boolean
        queuedAt:
          type: string
          format: date-time
        assignedAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        exitCode:
          type: integer
        resultSummary:
          type: string
        createdAt:
          type: string
          format: date-time
    RunStreamEvent:
      type: object
      required: [id, kind, sequence, occurredAt]
      properties:
        usage:
          $ref: "#/components/schemas/ResourceUsage"
        id:
          type: string
        kind:
          type: string
          enum: [state, log]
        state:
          type: string
        eventType:
          type: string
        stream:
          type: string
          enum: [stdout, stderr, system]
        sequence:
          type: integer
          minimum: 0
        message:
          type: string
        content:
          type: string
        exitCode:
          type: integer
        occurredAt:
          type: string
          format: date-time
    CronValidationRequest:
      type: object
      additionalProperties: false
      required: [cronExpression, timezone]
      properties:
        cronExpression:
          type: string
          description: 五段 Cron 表达式，例如每天凌晨 2 点为 0 2 * * *。
        timezone:
          type: string
          default: Asia/Shanghai
          description: IANA 时区名称。
    TaskScheduleRequest:
      allOf:
        - $ref: "#/components/schemas/CronValidationRequest"
        - type: object
          required: [enabled]
          properties:
            enabled:
              type: boolean
    TaskSchedule:
      allOf:
        - $ref: "#/components/schemas/TaskScheduleRequest"
        - type: object
          required: [id, definitionId, createdAt, updatedAt]
          properties:
            id:
              type: string
              format: uuid
            definitionId:
              type: string
              format: uuid
            nextRunAt:
              type: [string, "null"]
              format: date-time
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
    SecretMetadata:
      type: object
      additionalProperties: false
      required: [id, name, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        createdBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Member:
      type: object
      required: [id, email, displayName, enabled, roles, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        enabled:
          type: boolean
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
        createdAt:
          type: string
          format: date-time
    AuditEvent:
      type: object
      required: [id, action, targetType, targetId, details, createdAt]
      properties:
        id:
          type: string
          format: uuid
        actorId:
          type: string
          format: uuid
        action:
          type: string
        targetType:
          type: string
        targetId:
          type: string
        details:
          type: object
          additionalProperties: true
        ipAddress:
          type: string
        createdAt:
          type: string
          format: date-time
    Alert:
      type: object
      required: [id, resourceType, resourceId, code, severity, title, message, status, occurrences, firstOccurredAt, lastOccurredAt]
      properties:
        id:
          type: string
          format: uuid
        resourceType:
          type: string
        resourceId:
          type: string
        code:
          type: string
        severity:
          type: string
          enum: [info, warning, critical]
        title:
          type: string
        message:
          type: string
        status:
          type: string
          enum: [open, acknowledged, resolved]
        occurrences:
          type: integer
          minimum: 1
        firstOccurredAt:
          type: string
          format: date-time
        lastOccurredAt:
          type: string
          format: date-time
        acknowledgedBy:
          type: string
          format: uuid
        acknowledgedAt:
          type: string
          format: date-time
    ServerUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        serverGroupId:
          type: string
          description: 已存在的服务器组标识；空字符串表示移出分组。
        name:
          type: string
          minLength: 1
        labels:
          type: object
          additionalProperties:
            type: string
        schedulingWeight:
          type: integer
          minimum: 1
          maximum: 1000
        enabled:
          type: boolean
        draining:
          type: boolean
  responses:
    BadRequest:
      description: 请求内容无效
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: 当前用户没有执行该操作所需的权限
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: 请求的资源不存在
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: 未登录、会话已失效或登录凭据错误
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
