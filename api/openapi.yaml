openapi: 3.1.0
info:
  title: 云令控制 API
  version: 0.1.0
  description: 多服务器脚本调度平台的中央控制接口。
paths:
  /api/health:
    get:
      operationId: getHealth
      summary: 检查 API 健康状态
      responses:
        "200":
          description: API 正常
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
  /api/auth/login:
    post:
      operationId: login
      summary: 登录管理控制台
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: 登录成功，并通过安全 Cookie 返回会话令牌
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [message, expires_at]
                properties:
                  message:
                    type: string
                    const: 登录成功
                  expires_at:
                    type: string
                    format: date-time
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/auth/logout:
    post:
      operationId: logout
      summary: 退出当前会话
      security:
        - sessionCookie: []
      responses:
        "204":
          description: 已退出登录
  /api/auth/session:
    get:
      operationId: getSession
      summary: 获取当前登录用户
      security:
        - sessionCookie: []
      responses:
        "200":
          description: 当前会话有效
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: "#/components/schemas/SessionUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/servers/enrollment-tokens:
    post:
      operationId: createServerEnrollmentToken
      summary: 创建一次性服务器注册令牌
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollmentTokenRequest"
      responses:
        "201":
          description: 注册令牌创建成功，明文令牌仅在本次响应显示
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollmentTokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: 当前用户不是管理员
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/dashboard:
    get:
      operationId: getDashboard
      summary: 获取运行总览
      security:
        - sessionCookie: []
      responses:
        "200":
          description: 服务器、任务、成功率和最近动态统计
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/servers:
    get:
      operationId: listServers
      summary: 获取服务器和最新资源快照
      security:
        - sessionCookie: []
      responses:
        "200":
          description: 服务器列表
          content:
            application/json:
              schema:
                type: object
                required: [servers]
                properties:
                  servers:
                    type: array
                    items:
                      $ref: "#/components/schemas/Server"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/servers/{id}:
    patch:
      operationId: updateServer
      summary: 更新服务器调度设置
      description: 排空只阻止新任务分配；停用会断开当前代理连接并阻止重连。
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServerUpdate"
      responses:
        "200":
          description: 服务器已更新
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Server"
        "400":
          description: 更新内容无效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: 当前用户无服务器管理权限
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: 服务器不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/scripts:
    get:
      operationId: listScripts
      summary: 获取中央脚本列表
      security:
        - sessionCookie: []
      responses:
        "200":
          description: 脚本、分类、标签、运行环境与当前版本
          content:
            application/json:
              schema:
                type: object
                required: [scripts]
                properties:
                  scripts:
                    type: array
                    items:
                      $ref: "#/components/schemas/Script"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createScript
      summary: 创建脚本和初始草稿
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScriptCreateRequest"
      responses:
        "201":
          description: 脚本已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Script"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/scripts/import:
    post:
      operationId: importScript
      summary: 导入文本脚本为中央草稿
      description: 仅接受不超过 1 MB 的 .sh、.py、.js 和 .ps1 UTF-8 文本文件。
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                name:
                  type: string
                description:
                  type: string
      responses:
        "201":
          description: 脚本已导入为草稿
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Script"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/scripts/{id}:
    get:
      operationId: getScript
      summary: 获取脚本草稿和版本历史
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ScriptID"
      responses:
        "200":
          description: 脚本编辑详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScriptDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/scripts/{id}/draft:
    put:
      operationId: saveScriptDraft
      summary: 保存脚本草稿
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ScriptID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScriptEditorRequest"
      responses:
        "200":
          description: 草稿已保存
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScriptDraft"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/scripts/{id}/publish:
    post:
      operationId: publishScript
      summary: 发布不可变脚本版本
      description: 脚本包按 SHA-256 内容寻址保存；发布说明必须包含中文，并明确分发目标。
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ScriptID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScriptPublishRequest"
      responses:
        "201":
          description: 不可变版本已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScriptVersion"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/scripts/{id}/versions:
    get:
      operationId: listScriptVersions
      summary: 获取脚本不可变版本历史
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ScriptID"
      responses:
        "200":
          description: 按版本号倒序返回版本
          content:
            application/json:
              schema:
                type: object
                required: [versions]
                properties:
                  versions:
                    type: array
                    items:
                      $ref: "#/components/schemas/ScriptVersion"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/scripts/{id}/versions/{versionID}/content:
    get:
      operationId: getScriptVersionContent
      summary: 获取已校验的历史版本文本内容
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ScriptID"
        - name: versionID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 历史脚本内容
          content:
            application/json:
              schema:
                type: object
                required: [content]
                properties:
                  content:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/scripts/{id}/rollback:
    post:
      operationId: rollbackScript
      summary: 将历史内容重新发布为新版本
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ScriptID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScriptRollbackRequest"
      responses:
        "201":
          description: 回滚内容已追加为新版本
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScriptVersion"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/scripts/{id}/syncs:
    get:
      operationId: listScriptSyncs
      summary: 获取脚本版本在各服务器的同步状态
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ScriptID"
      responses:
        "200":
          description: 同步状态列表
          content:
            application/json:
              schema:
                type: object
                required: [syncs]
                properties:
                  syncs:
                    type: array
                    items:
                      $ref: "#/components/schemas/ScriptSync"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/scripts/{id}/syncs/{syncID}/retry:
    post:
      operationId: retryScriptSync
      summary: 重新同步失败或漂移的服务器脚本
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ScriptID"
        - name: syncID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: 已重新进入等待下载状态
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/tasks:
    get:
      operationId: listTasks
      summary: 获取任务定义列表
      security:
        - sessionCookie: []
      responses:
        "200":
          description: 任务定义、资源约束与排队规则
          content:
            application/json:
              schema:
                type: object
                required: [tasks]
                properties:
                  tasks:
                    type: array
                    items:
                      $ref: "#/components/schemas/TaskDefinition"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createTask
      summary: 创建任务定义
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskDefinitionRequest"
      responses:
        "201":
          description: 任务定义已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDefinition"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/tasks/cron/validate:
    post:
      operationId: validateTaskCron
      summary: 校验五段 Cron 表达式和 IANA 时区
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CronValidationRequest"
      responses:
        "200":
          description: Cron 规则有效
          content:
            application/json:
              schema:
                type: object
                required: [valid]
                properties:
                  valid:
                    type: boolean
                    const: true
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/tasks/{id}:
    get:
      operationId: getTask
      summary: 获取任务定义
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/TaskID"
      responses:
        "200":
          description: 任务定义详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDefinition"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateTask
      summary: 更新任务定义
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/TaskID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskDefinitionRequest"
      responses:
        "200":
          description: 任务定义已更新
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDefinition"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteTask
      summary: 删除没有运行记录的任务定义
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/TaskID"
      responses:
        "204":
          description: 任务定义已删除
        "404":
          $ref: "#/components/responses/NotFound"
  /api/tasks/{id}/enabled:
    patch:
      operationId: setTaskEnabled
      summary: 启用或停用任务
      description: 停用时默认保留已经排队的运行实例；只有明确传入 cancelQueued=true 才取消它们。
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/TaskID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled]
              properties:
                enabled:
                  type: boolean
                cancelQueued:
                  type: boolean
                  default: false
      responses:
        "204":
          description: 任务状态已更新
        "404":
          $ref: "#/components/responses/NotFound"
  /api/tasks/{id}/run:
    post:
      operationId: runTask
      summary: 手动创建排队运行实例
      description: 创建时锁定具体脚本版本并复制资源、重试和参数快照；没有可用服务器时继续排队。
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/TaskID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                parameters:
                  type: object
                  additionalProperties: true
      responses:
        "201":
          description: 运行实例已进入排队队列
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskRun"
        "409":
          description: 任务已停用或没有可执行版本
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/tasks/{id}/schedules:
    get:
      operationId: listTaskSchedules
      summary: 获取任务的定时计划
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/TaskID"
      responses:
        "200":
          description: 定时计划列表
          content:
            application/json:
              schema:
                type: object
                required: [schedules]
                properties:
                  schedules:
                    type: array
                    items:
                      $ref: "#/components/schemas/TaskSchedule"
    post:
      operationId: createTaskSchedule
      summary: 创建任务定时计划
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/TaskID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskScheduleRequest"
      responses:
        "201":
          description: 定时计划已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskSchedule"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/tasks/{id}/schedules/{scheduleID}:
    delete:
      operationId: deleteTaskSchedule
      summary: 删除任务定时计划
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/TaskID"
        - name: scheduleID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: 定时计划已删除
        "404":
          $ref: "#/components/responses/NotFound"
  /api/agent/enroll:
    post:
      operationId: enrollAgent
      summary: 使用一次性令牌注册执行代理
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token:
                  type: string
                  writeOnly: true
      responses:
        "201":
          description: 注册成功，独立代理凭据仅在本次响应显示
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentCredentials"
        "401":
          description: 注册令牌无效、已使用或已过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/agent/connect:
    get:
      operationId: connectAgent
      summary: 建立代理 WebSocket 长连接
      description: 代理通过此连接上报心跳；中央服务以凭据绑定的服务器身份为准。
      security:
        - agentBearer: []
      responses:
        "101":
          description: WebSocket 协议升级成功
        "401":
          description: 代理凭据无效或已撤销
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/agent/scripts/{versionID}/artifact:
    get:
      operationId: downloadAgentScriptArtifact
      summary: 下载待同步的不可变脚本包
      security:
        - agentBearer: []
      parameters:
        - name: versionID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: gzip 压缩的 tar 脚本包，代理会在原子切换前校验 SHA-256
          headers:
            X-Content-SHA256:
              schema:
                type: string
                pattern: ^[0-9a-f]{64}$
          content:
            application/gzip:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: yunling_session
    agentBearer:
      type: http
      scheme: bearer
      bearerFormat: 云令代理凭据
  parameters:
    ScriptID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TaskID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    Role:
      type: string
      enum: [admin, operator, developer, viewer]
    SessionUser:
      type: object
      required: [user_id, email, display_name, roles]
      properties:
        user_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
    EnrollmentTokenRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
        cloud_provider:
          type: string
        region:
          type: string
        labels:
          type: object
          additionalProperties:
            type: string
    EnrollmentTokenResponse:
      type: object
      required: [id, token, expires_at]
      properties:
        id:
          type: string
          format: uuid
        token:
          type: string
          writeOnly: true
        expires_at:
          type: string
          format: date-time
    AgentCredentials:
      type: object
      required: [server_id, credential]
      properties:
        server_id:
          type: string
          format: uuid
        credential:
          type: string
          writeOnly: true
    AgentHeartbeat:
      type: object
      required:
        - server_id
        - sequence
        - sent_at
        - cpu_total_milli
        - cpu_used_milli
        - memory_total_bytes
        - memory_used_bytes
        - disk_total_bytes
        - disk_free_bytes
        - running_tasks
        - runtimes
        - agent_version
      properties:
        server_id:
          type: string
          format: uuid
        sequence:
          type: integer
          minimum: 1
        sent_at:
          type: string
          format: date-time
        cpu_total_milli:
          type: integer
          minimum: 0
        cpu_used_milli:
          type: integer
          minimum: 0
        memory_total_bytes:
          type: integer
          minimum: 0
        memory_used_bytes:
          type: integer
          minimum: 0
        disk_total_bytes:
          type: integer
          minimum: 0
        disk_free_bytes:
          type: integer
          minimum: 0
        running_tasks:
          type: integer
          minimum: 0
        runtimes:
          type: array
          items:
            type: string
        agent_version:
          type: string
    Dashboard:
      type: object
      required: [onlineServers, totalServers, runningRuns, queuedRuns, todaySuccessRate, servers, recentEvents]
      properties:
        onlineServers:
          type: integer
          minimum: 0
        totalServers:
          type: integer
          minimum: 0
        runningRuns:
          type: integer
          minimum: 0
        queuedRuns:
          type: integer
          minimum: 0
        todaySuccessRate:
          type: number
          minimum: 0
          maximum: 100
        servers:
          type: array
          items:
            $ref: "#/components/schemas/Server"
        recentEvents:
          type: array
          items:
            $ref: "#/components/schemas/RecentEvent"
    RecentEvent:
      type: object
      required: [id, type, message, occurredAt]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
        message:
          type: string
        occurredAt:
          type: string
          format: date-time
    Server:
      type: object
      required:
        - id
        - name
        - cloudProvider
        - region
        - status
        - enabled
        - draining
        - labels
        - runtimes
        - agentVersion
        - schedulingWeight
        - cpuUsagePercent
        - memoryTotalBytes
        - memoryAvailableBytes
        - diskTotalBytes
        - diskAvailableBytes
        - runningTasks
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        cloudProvider:
          type: string
        region:
          type: string
        status:
          type: string
          enum: [pending, online, offline, draining, quarantined]
        enabled:
          type: boolean
        draining:
          type: boolean
        labels:
          type: object
          additionalProperties:
            type: string
        runtimes:
          type: array
          items:
            type: string
        agentVersion:
          type: string
        schedulingWeight:
          type: integer
          minimum: 1
          maximum: 1000
        cpuUsagePercent:
          type: number
          minimum: 0
          maximum: 100
        memoryTotalBytes:
          type: integer
          minimum: 0
        memoryAvailableBytes:
          type: integer
          minimum: 0
        diskTotalBytes:
          type: integer
          minimum: 0
        diskAvailableBytes:
          type: integer
          minimum: 0
        runningTasks:
          type: integer
          minimum: 0
        lastSeenAt:
          type: [string, "null"]
          format: date-time
    Script:
      type: object
      required: [id, name, description, runtime, category, tags, currentVersionId, currentVersion, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        runtime:
          $ref: "#/components/schemas/ScriptRuntime"
        category:
          type: string
        tags:
          type: array
          items:
            type: string
        currentVersionId:
          type: string
          description: 尚未发布时为空字符串。
        currentVersion:
          type: integer
          minimum: 0
        draftUpdatedAt:
          type: [string, "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ScriptRuntime:
      type: string
      enum: [bash, python3, node, powershell]
    DistributionRule:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode:
          type: string
          enum: [all_compatible, server_group, labels, on_demand]
        serverGroupId:
          type: string
        labels:
          type: object
          additionalProperties:
            type: string
    ParameterDefinition:
      type: object
      additionalProperties: false
      required: [name, type, required]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [string, number, boolean]
        required:
          type: boolean
        description:
          type: string
    ResourceRequirements:
      type: object
      additionalProperties: false
      required: [cpuMillicores, memoryBytes, diskBytes]
      properties:
        cpuMillicores:
          type: integer
          minimum: 1
        memoryBytes:
          type: integer
          minimum: 1
        diskBytes:
          type: integer
          minimum: 1
    ScriptManifest:
      type: object
      required: [runtime, entrypoint, category, tags, distribution, parameterDefinitions, resources]
      properties:
        runtime:
          $ref: "#/components/schemas/ScriptRuntime"
        entrypoint:
          type: string
        category:
          type: string
        tags:
          type: array
          items:
            type: string
        distribution:
          $ref: "#/components/schemas/DistributionRule"
        parameterDefinitions:
          type: array
          items:
            $ref: "#/components/schemas/ParameterDefinition"
        resources:
          $ref: "#/components/schemas/ResourceRequirements"
    ScriptDraft:
      type: object
      required: [scriptId, baseVersionId, content, manifest, updatedAt]
      properties:
        scriptId:
          type: string
          format: uuid
        baseVersionId:
          type: string
          description: 尚未发布时为空字符串。
        content:
          type: string
          maxLength: 1048576
        manifest:
          $ref: "#/components/schemas/ScriptManifest"
        updatedAt:
          type: string
          format: date-time
    ScriptVersion:
      type: object
      required: [id, scriptId, number, artifactUri, artifactSha256, entrypoint, manifest, releaseNotes, createdBy, createdAt]
      properties:
        id:
          type: string
          format: uuid
        scriptId:
          type: string
          format: uuid
        number:
          type: integer
          minimum: 1
        artifactUri:
          type: string
          pattern: ^scripts/.+/[0-9a-f]{64}\.tar\.gz$
        artifactSha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        entrypoint:
          type: string
        manifest:
          $ref: "#/components/schemas/ScriptManifest"
        releaseNotes:
          type: string
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
    ScriptSync:
      type: object
      required: [id, serverId, serverName, scriptId, versionId, versionNumber, state, artifactSha256, errorCode, errorMessage, blocked, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        serverId:
          type: string
          format: uuid
        serverName:
          type: string
        scriptId:
          type: string
          format: uuid
        versionId:
          type: string
          format: uuid
        versionNumber:
          type: integer
          minimum: 1
        state:
          type: string
          enum: [pending, downloading, ready, failed, drifted]
        artifactSha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        errorCode:
          type: string
        errorMessage:
          type: string
        blocked:
          type: boolean
        syncedAt:
          type: [string, "null"]
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ScriptDetail:
      type: object
      required: [script, draft, versions]
      properties:
        script:
          $ref: "#/components/schemas/Script"
        draft:
          $ref: "#/components/schemas/ScriptDraft"
        versions:
          type: array
          items:
            $ref: "#/components/schemas/ScriptVersion"
    ScriptCreateRequest:
      type: object
      additionalProperties: false
      required: [name, runtime]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        runtime:
          $ref: "#/components/schemas/ScriptRuntime"
        entrypoint:
          type: string
        category:
          type: string
        tags:
          type: array
          items:
            type: string
        content:
          type: string
          maxLength: 1048576
    ScriptEditorRequest:
      type: object
      additionalProperties: false
      required: [content, runtime, entrypoint, category, tags, distribution, parameterDefinitions, resources]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 1048576
        runtime:
          $ref: "#/components/schemas/ScriptRuntime"
        entrypoint:
          type: string
        category:
          type: string
        tags:
          type: array
          items:
            type: string
        distribution:
          $ref: "#/components/schemas/DistributionRule"
        parameterDefinitions:
          type: array
          items:
            $ref: "#/components/schemas/ParameterDefinition"
        resources:
          $ref: "#/components/schemas/ResourceRequirements"
    ScriptPublishRequest:
      type: object
      additionalProperties: false
      required: [content, runtime, entrypoint, category, tags, distribution, parameterDefinitions, resources, releaseNotes]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 1048576
        runtime:
          $ref: "#/components/schemas/ScriptRuntime"
        entrypoint:
          type: string
        category:
          type: string
        tags:
          type: array
          items:
            type: string
        distribution:
          $ref: "#/components/schemas/DistributionRule"
        parameterDefinitions:
          type: array
          items:
            $ref: "#/components/schemas/ParameterDefinition"
        resources:
          $ref: "#/components/schemas/ResourceRequirements"
        releaseNotes:
          type: string
          description: 必须包含中文发布说明。
    ScriptRollbackRequest:
      type: object
      additionalProperties: false
      required: [versionId, releaseNotes]
      properties:
        versionId:
          type: string
          format: uuid
        releaseNotes:
          type: string
          description: 必须包含中文回滚说明。
    TaskResources:
      type: object
      additionalProperties: false
      required: [cpuMillicores, memoryBytes, diskBytes]
      properties:
        cpuMillicores:
          type: integer
          minimum: 1
        memoryBytes:
          type: integer
          minimum: 1
        diskBytes:
          type: integer
          minimum: 1
    TaskRetryPolicy:
      type: object
      additionalProperties: false
      required: [maxRetries, backoffSeconds]
      properties:
        maxRetries:
          type: integer
          minimum: 0
        backoffSeconds:
          type: integer
          minimum: 0
    TaskDefinitionRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - scriptId
        - versionPolicy
        - parameters
        - secretRefs
        - priority
        - requiredLabels
        - requiredRuntime
        - resources
        - maxConcurrency
        - timeoutSeconds
        - maxWaitSeconds
        - retryPolicy
        - idempotent
        - enabled
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        scriptId:
          type: string
          format: uuid
        versionPolicy:
          type: string
          enum: [latest, pinned]
        pinnedVersionId:
          type: string
          format: uuid
        parameters:
          type: object
          additionalProperties: true
        secretRefs:
          type: object
          additionalProperties:
            type: string
        priority:
          type: integer
          minimum: 0
          maximum: 100
        requiredLabels:
          type: object
          additionalProperties:
            type: string
        requiredRuntime:
          $ref: "#/components/schemas/ScriptRuntime"
        resources:
          $ref: "#/components/schemas/TaskResources"
        maxConcurrency:
          type: integer
          minimum: 1
        timeoutSeconds:
          type: integer
          minimum: 1
        maxWaitSeconds:
          type: integer
          minimum: 1
        retryPolicy:
          $ref: "#/components/schemas/TaskRetryPolicy"
        idempotent:
          type: boolean
        enabled:
          type: boolean
    TaskDefinition:
      allOf:
        - $ref: "#/components/schemas/TaskDefinitionRequest"
        - type: object
          required: [id, scriptName, createdAt, updatedAt]
          properties:
            id:
              type: string
              format: uuid
            scriptName:
              type: string
            createdBy:
              type: string
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
    TaskRun:
      type: object
      required:
        - id
        - definitionId
        - scriptVersionId
        - triggerType
        - state
        - parameters
        - priority
        - resources
        - maxConcurrency
        - timeoutSeconds
        - maxWaitSeconds
        - retryPolicy
        - idempotent
        - queuedAt
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        definitionId:
          type: string
          format: uuid
        scriptVersionId:
          type: string
          format: uuid
        triggerType:
          type: string
          enum: [manual, schedule, retry]
        state:
          type: string
          enum: [queued, scheduling, assigned, syncing, running, succeeded, failed, timed_out, cancelled, expired, unknown]
        parameters:
          type: object
          additionalProperties: true
        priority:
          type: integer
          minimum: 0
          maximum: 100
        resources:
          $ref: "#/components/schemas/TaskResources"
        maxConcurrency:
          type: integer
          minimum: 1
        timeoutSeconds:
          type: integer
          minimum: 1
        maxWaitSeconds:
          type: integer
          minimum: 1
        retryPolicy:
          $ref: "#/components/schemas/TaskRetryPolicy"
        idempotent:
          type: boolean
        scheduledFor:
          type: [string, "null"]
          format: date-time
        queuedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    CronValidationRequest:
      type: object
      additionalProperties: false
      required: [cronExpression, timezone]
      properties:
        cronExpression:
          type: string
          description: 五段 Cron 表达式，例如每天凌晨 2 点为 0 2 * * *。
        timezone:
          type: string
          default: Asia/Shanghai
          description: IANA 时区名称。
    TaskScheduleRequest:
      allOf:
        - $ref: "#/components/schemas/CronValidationRequest"
        - type: object
          required: [enabled]
          properties:
            enabled:
              type: boolean
    TaskSchedule:
      allOf:
        - $ref: "#/components/schemas/TaskScheduleRequest"
        - type: object
          required: [id, definitionId, createdAt, updatedAt]
          properties:
            id:
              type: string
              format: uuid
            definitionId:
              type: string
              format: uuid
            nextRunAt:
              type: [string, "null"]
              format: date-time
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
    ServerUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
        labels:
          type: object
          additionalProperties:
            type: string
        schedulingWeight:
          type: integer
          minimum: 1
          maximum: 1000
        enabled:
          type: boolean
        draining:
          type: boolean
  responses:
    BadRequest:
      description: 请求内容无效
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: 当前用户没有脚本发布权限
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: 脚本或脚本版本不存在
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: 未登录、会话已失效或登录凭据错误
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
