worker_processes 1;
pid /tmp/nginx.pid;

events {
  worker_connections 64;
}

http {
  access_log off;
  error_log /dev/stderr notice;

  server {
    listen 8080;

    location = /healthz {
      default_type text/plain;
      return 200 "ok\n";
    }

    location = /api/health {
      default_type application/json;
      return 200 '{"status":"ok"}';
    }
  }

  server {
    listen 8081;

    location = /healthz {
      default_type text/plain;
      return 200 "ok\n";
    }
  }
}
