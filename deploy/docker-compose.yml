name: yunling

x-service-security: &service-security
  read_only: true
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true

x-api-environment: &api-environment
  TZ: Asia/Shanghai
  YUNLING_HTTP_ADDR: :8080
  YUNLING_DATABASE_URL: postgres://${YUNLING_POSTGRES_USER}:${YUNLING_POSTGRES_PASSWORD}@postgres:5432/${YUNLING_POSTGRES_DB}?sslmode=disable
  YUNLING_PUBLIC_URL: https://${YUNLING_DOMAIN}
  YUNLING_TRUST_PROXY: "true"
  YUNLING_MASTER_KEY_FILE: /run/secrets/yunling-master-key
  YUNLING_MASTER_KEY_VERSION: ${YUNLING_MASTER_KEY_VERSION:-1}
  YUNLING_AGENT_RELEASE_DIR: /opt/yunling/releases/agent
  YUNLING_S3_ENDPOINT: minio:9000
  YUNLING_S3_ACCESS_KEY: ${YUNLING_MINIO_ROOT_USER}
  YUNLING_S3_SECRET_KEY: ${YUNLING_MINIO_ROOT_PASSWORD}
  YUNLING_S3_BUCKET: ${YUNLING_S3_BUCKET:-yunling-artifacts}
  YUNLING_S3_SECURE: "false"

services:
  caddy:
    <<: *service-security
    image: caddy:2.11.4-alpine
    environment:
      YUNLING_DOMAIN: ${YUNLING_DOMAIN}
      YUNLING_TLS_EMAIL: ${YUNLING_TLS_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    networks:
      - frontend
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    <<: *service-security
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /var/cache/nginx:size=16m,uid=101,gid=101
    expose:
      - "8080"
    networks:
      - frontend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz | grep -q ok"]
      interval: 15s
      timeout: 5s
      retries: 5

  api:
    <<: *service-security
    build:
      context: ..
      dockerfile: deploy/Dockerfile.services
    environment: *api-environment
    volumes:
      - yunling_api_secrets:/run/secrets:ro
      - yunling_agent_releases:/opt/yunling/releases/agent:ro
    tmpfs:
      - /tmp:size=64m,uid=10001,gid=10001,mode=1770
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/health | grep -q ok"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

  scheduler:
    <<: *service-security
    build:
      context: ..
      dockerfile: deploy/Dockerfile.services
    entrypoint: ["/usr/local/bin/yunling-scheduler"]
    environment:
      TZ: Asia/Shanghai
      YUNLING_DATABASE_URL: postgres://${YUNLING_POSTGRES_USER}:${YUNLING_POSTGRES_PASSWORD}@postgres:5432/${YUNLING_POSTGRES_DB}?sslmode=disable
      YUNLING_REDIS_ADDR: redis:6379
      YUNLING_REDIS_PASSWORD: ${YUNLING_REDIS_PASSWORD}
      YUNLING_SCHEDULER_SCAN_INTERVAL: ${YUNLING_SCHEDULER_SCAN_INTERVAL:-15s}
    tmpfs:
      - /tmp:size=32m,uid=10001,gid=10001,mode=1770
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  ops-secrets-init:
    profiles: ["tools"]
    image: alpine:3.23.3
    user: "0:0"
    read_only: true
    restart: "no"
    network_mode: none
    security_opt:
      - no-new-privileges:true
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        install -m 0400 -o 10001 -g 10001 /source/yunling-master-key /api-target/yunling-master-key;
        install -m 0400 -o 10001 -g 10001 /source/backup-postgres-password /database-target/backup-postgres-password;
        install -m 0400 -o 10001 -g 10001 /source/verify-postgres-password /database-target/verify-postgres-password;
        install -m 0400 -o 10001 -g 10001 /source/backup-minio-access-key /minio-target/backup-minio-access-key;
        install -m 0400 -o 10001 -g 10001 /source/backup-minio-secret-key /minio-target/backup-minio-secret-key;
        for source in /source/*; do
          name="$${source##*/}";
          install -m 0400 -o 10001 -g 10001 "$$source" "/target/$$name";
        done
    volumes:
      - ./secrets/yunling-master-key:/source/yunling-master-key:ro
      - ./secrets/cos-secret-id:/source/cos-secret-id:ro
      - ./secrets/cos-secret-key:/source/cos-secret-key:ro
      - ./secrets/restic-password:/source/restic-password:ro
      - ./secrets/backup-postgres-password:/source/backup-postgres-password:ro
      - ./secrets/verify-postgres-password:/source/verify-postgres-password:ro
      - ./secrets/backup-minio-access-key:/source/backup-minio-access-key:ro
      - ./secrets/backup-minio-secret-key:/source/backup-minio-secret-key:ro
      - yunling_ops_secrets:/target
      - yunling_api_secrets:/api-target
      - yunling_database_secrets:/database-target
      - yunling_minio_backup_secrets:/minio-target
    tmpfs:
      - /tmp:size=8m,mode=0700

  ops-data-init:
    image: alpine:3.23.3
    user: "0:0"
    read_only: true
    restart: "no"
    network_mode: none
    security_opt:
      - no-new-privileges:true
    environment:
      YUNLING_OPS_DATA_DIR: /data
    entrypoint: ["/bin/sh", "/opt/yunling/initialize-ops-data.sh"]
    volumes:
      - ./initialize-ops-data.sh:/opt/yunling/initialize-ops-data.sh:ro
      - yunling_ops_data:/data
    tmpfs:
      - /tmp:size=8m,mode=0700

  ops:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.ops
    user: "10001:10001"
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: Asia/Shanghai
      YUNLING_DATABASE_URL: postgres://${YUNLING_POSTGRES_USER}:${YUNLING_POSTGRES_PASSWORD}@postgres:5432/${YUNLING_POSTGRES_DB}?sslmode=disable
      YUNLING_MASTER_KEY_FILE: /run/secrets/yunling-master-key
      YUNLING_MASTER_KEY_VERSION: ${YUNLING_MASTER_KEY_VERSION:-1}
      YUNLING_OPS_HTTP_ADDR: :8081
      YUNLING_OPS_SCAN_INTERVAL: ${YUNLING_OPS_SCAN_INTERVAL:-15s}
      YUNLING_BACKUP_DATABASE_URL: postgres://yunling_backup@postgres:5432/${YUNLING_POSTGRES_DB}?sslmode=disable
      YUNLING_VERIFY_DATABASE_URL: postgres://yunling_verifier@postgres:5432/postgres?sslmode=disable
      YUNLING_BACKUP_POSTGRES_PASSWORD_FILE: /run/secrets/backup-postgres-password
      YUNLING_VERIFY_POSTGRES_PASSWORD_FILE: /run/secrets/verify-postgres-password
      YUNLING_BACKUP_MINIO_ENDPOINT: http://minio:9000
      YUNLING_BACKUP_MINIO_BUCKET: ${YUNLING_S3_BUCKET:-yunling-artifacts}
      YUNLING_BACKUP_MINIO_ACCESS_KEY_FILE: /run/secrets/backup-minio-access-key
      YUNLING_BACKUP_MINIO_SECRET_KEY_FILE: /run/secrets/backup-minio-secret-key
      YUNLING_COS_ENDPOINT: ${YUNLING_COS_ENDPOINT}
      YUNLING_COS_REGION: ${YUNLING_COS_REGION}
      YUNLING_COS_BUCKET: ${YUNLING_COS_BUCKET}
      YUNLING_COS_PREFIX: ${YUNLING_COS_PREFIX:-yunling}
      YUNLING_COS_SECRET_ID_FILE: /run/secrets/cos-secret-id
      YUNLING_COS_SECRET_KEY_FILE: /run/secrets/cos-secret-key
      YUNLING_RESTIC_PASSWORD_FILE: /run/secrets/restic-password
      YUNLING_BACKUP_ROOT: /var/lib/yunling-ops
      YUNLING_GIT_REVISION: ${YUNLING_GIT_REVISION:-unknown}
      HOME: /var/lib/yunling-ops/home
      XDG_CACHE_HOME: /var/lib/yunling-ops/cache
      MC_CONFIG_DIR: /var/lib/yunling-ops/mc
    volumes:
      - yunling_ops_secrets:/run/secrets:ro
      - ./config/local-repository:/run/config/local-repository:ro
      - ./config/cos-repository:/run/config/cos-repository:ro
      - yunling_ops_data:/var/lib/yunling-ops
    tmpfs:
      - /tmp:size=32m,uid=10001,gid=10001,mode=1770
    depends_on:
      postgres:
        condition: service_healthy
      ops-data-init:
        condition: service_completed_successfully
      database-roles-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    networks:
      - backend
      - egress
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/healthz | grep -q ok"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  bootstrap:
    profiles: ["tools"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.services
    entrypoint: ["/usr/local/bin/yunling-bootstrap"]
    read_only: true
    security_opt:
      - no-new-privileges:true
    environment:
      YUNLING_DATABASE_URL: postgres://${YUNLING_POSTGRES_USER}:${YUNLING_POSTGRES_PASSWORD}@postgres:5432/${YUNLING_POSTGRES_DB}?sslmode=disable
      YUNLING_BOOTSTRAP_EMAIL: ${YUNLING_BOOTSTRAP_EMAIL:-}
      YUNLING_BOOTSTRAP_NAME: ${YUNLING_BOOTSTRAP_NAME:-系统管理员}
      YUNLING_BOOTSTRAP_PASSWORD: ${YUNLING_BOOTSTRAP_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  postgres:
    <<: *service-security
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${YUNLING_POSTGRES_DB}
      POSTGRES_USER: ${YUNLING_POSTGRES_USER}
      POSTGRES_PASSWORD: ${YUNLING_POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../migrations:/migrations:ro
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/001-yunling-migrate.sh:ro
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /var/run/postgresql:size=16m,uid=70,gid=70,mode=0770
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  database-roles-init:
    image: postgres:18.6-alpine
    user: "10001:10001"
    read_only: true
    restart: "no"
    security_opt:
      - no-new-privileges:true
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${YUNLING_POSTGRES_DB}
      PGUSER: ${YUNLING_POSTGRES_USER}
      PGPASSWORD: ${YUNLING_POSTGRES_PASSWORD}
      YUNLING_POSTGRES_DB: ${YUNLING_POSTGRES_DB}
      YUNLING_POSTGRES_USER: ${YUNLING_POSTGRES_USER}
    entrypoint: ["/bin/sh", "/opt/yunling/database-roles-init.sh"]
    volumes:
      - ./database-roles-init.sh:/opt/yunling/database-roles-init.sh:ro
      - yunling_database_secrets:/run/secrets:ro
    tmpfs:
      - /tmp:size=8m,uid=10001,gid=10001,mode=0700
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  redis:
    <<: *service-security
    image: redis:8.10.0-alpine
    environment:
      YUNLING_REDIS_PASSWORD: ${YUNLING_REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$YUNLING_REDIS_PASSWORD\""]
    volumes:
      - redis_data:/data
    tmpfs:
      - /tmp:size=32m,mode=1777
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$YUNLING_REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    <<: *service-security
    image: yunling-minio:RELEASE.2025-10-15T17-29-55Z
    build:
      context: ..
      dockerfile: deploy/Dockerfile.minio
      args:
        MINIO_VERSION: RELEASE.2025-10-15T17-29-55Z
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${YUNLING_MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${YUNLING_MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    tmpfs:
      - /tmp:size=64m,mode=1777
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    read_only: true
    security_opt:
      - no-new-privileges:true
    environment:
      MC_CONFIG_DIR: /tmp/mc
      YUNLING_MINIO_ROOT_USER: ${YUNLING_MINIO_ROOT_USER}
      YUNLING_MINIO_ROOT_PASSWORD: ${YUNLING_MINIO_ROOT_PASSWORD}
      YUNLING_S3_BUCKET: ${YUNLING_S3_BUCKET:-yunling-artifacts}
    entrypoint: ["/bin/sh", "/opt/yunling/minio-init.sh"]
    volumes:
      - ./minio-init.sh:/opt/yunling/minio-init.sh:ro
      - ./minio-backup-policy.json:/opt/yunling/minio-backup-policy.json:ro
      - yunling_minio_backup_secrets:/run/secrets:ro
    tmpfs:
      - /tmp:size=16m,mode=1777
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - backend

volumes:
  postgres_data:
  redis_data:
  minio_data:
  caddy_data:
  caddy_config:
  yunling_ops_secrets:
  yunling_api_secrets:
  yunling_database_secrets:
  yunling_minio_backup_secrets:
  yunling_ops_data:
  yunling_agent_releases:

networks:
  frontend:
  backend:
    internal: true
  egress:
